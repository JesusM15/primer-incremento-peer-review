<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Revisión por Pares</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .06), 0 1px 4px rgba(0, 0, 0, .04);
            text-align: center;
        }

        /* Brand mark */
        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: #111;
            border-radius: 10px;
            font-size: 1.4rem;
            margin-bottom: 1.25rem;
        }

        .login-header {
            margin-bottom: 1.75rem;
        }

        .login-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #111;
            margin-bottom: 0.4rem;
        }

        .login-header p {
            font-size: 0.82rem;
            color: #666;
            line-height: 1.5;
        }

        /* Role selection */
        .role-selection h2 {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 0.875rem;
        }

        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .role-btn {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.875rem 1rem;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        }

        .role-btn:hover {
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
        }

        .role-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .role-icon {
            font-size: 1.25rem;
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f4f5;
            border-radius: 8px;
        }

        .role-btn-text {
            flex: 1;
        }

        .role-btn-text strong {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: #111;
            margin-bottom: 0.15rem;
        }

        .role-description {
            display: block;
            font-size: 0.75rem;
            color: #888;
            line-height: 1.4;
        }

        .role-arrow {
            color: #ccc;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: transform 0.15s, color 0.15s;
        }

        .role-btn:hover .role-arrow {
            color: #111;
            transform: translateX(2px);
        }

        /* Loading */
        .loading {
            display: none;
            font-size: 0.82rem;
            color: #666;
            margin-bottom: 1rem;
            padding: 0.6rem;
            background: #fafafa;
            border: 1px solid #eaeaea;
            border-radius: 6px;
        }

        .loading.show {
            display: block;
        }

        /* Footer */
        .footer {
            padding-top: 1.25rem;
            border-top: 1px solid #f0f0f0;
            font-size: 0.72rem;
            color: #bbb;
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
                align-items: flex-start;
                padding-top: 2rem;
            }

            .login-container {
                padding: 1.75rem 1.25rem;
            }

            .login-header h1 {
                font-size: 1.2rem;
            }
        }
    </style>

</head>

<body>
    <div class="login-container">

        <div class="brand-mark">📋</div>

        <div class="login-header">
            <h1>Revisión por Pares</h1>
            <p>Selecciona tu rol para continuar</p>
        </div>

        <div class="role-selection">
            <h2>Iniciar sesión como</h2>
            <div class="role-buttons">
                <button class="role-btn" onclick="selectRole('Autor')">
                    <span class="role-icon">✍️</span>
                    <span class="role-btn-text">
                        <strong>Autor</strong>
                        <span class="role-description">Crear y editar artículos</span>
                    </span>
                    <span class="role-arrow">→</span>
                </button>

                <button class="role-btn" onclick="selectRole('Revisor')">
                    <span class="role-icon">👁️</span>
                    <span class="role-btn-text">
                        <strong>Revisor</strong>
                        <span class="role-description">Comentar y aprobar artículos</span>
                    </span>
                    <span class="role-arrow">→</span>
                </button>

                <button class="role-btn" onclick="selectRole('Editor')">
                    <span class="role-icon">📝</span>
                    <span class="role-btn-text">
                        <strong>Editor</strong>
                        <span class="role-description">Gestionar artículos y revisores</span>
                    </span>
                    <span class="role-arrow">→</span>
                </button>
            </div>
        </div>

        <div class="loading" id="loading">Iniciando sesión…</div>

        <div class="footer">
            <p>Sistema offline-first · revisión por pares</p>
        </div>
    </div>

    <script>
        // Función simple y directa para seleccionar rol
        function selectRole(role) {
            console.log('� Rol seleccionado:', role);

            // Mostrar loading
            const loading = document.getElementById('loading');
            loading.classList.add('show');
            loading.textContent = 'Iniciando sesión...';

            // Deshabilitar botones
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.5';
            });

            // Crear usuario y guardar en localStorage
            const user = {
                id: `user_${Date.now()}`,
                name: `Usuario ${role}`,
                role: role,
                createdAt: new Date().toISOString(),
                sessionActive: true
            };

            // Guardar en localStorage
            localStorage.setItem('peerreview_user', JSON.stringify(user));
            console.log('✅ Usuario guardado en localStorage:', user);

            // Verificar que se guardó
            const saved = localStorage.getItem('peerreview_user');
            console.log('� Verificación - Usuario en localStorage:', saved);

            // Redirigir al dashboard después de un breve delay
            setTimeout(() => {
                console.log('🚀 Redirigiendo al dashboard...');
                window.location.href = './dashboard.html';
            }, 500);
        }

        // Verificar si ya está autenticado al cargar
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('peerreview_user');

            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    console.log('� Usuario ya autenticado:', user);

                    if (user.sessionActive && user.role) {
                        console.log('� Redirigiendo al dashboard...');
                        window.location.href = './dashboard.html';
                        return;
                    }
                } catch (error) {
                    console.warn('❌ Error leyendo usuario:', error);
                    localStorage.removeItem('peerreview_user');
                }
            }

            console.log('🔐 Listo para selección de rol');
        });
    </script>
</body>

</html>
