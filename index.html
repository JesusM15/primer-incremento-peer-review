<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1976d2" />
  <meta name="description" content="Aplicación para gestión y revisión de artículos académicos" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  <title>PeerReview — Gestión de Artículos</title>
  <link rel="stylesheet" href="styles/minimal.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span class="logo">PeerReview</span>
      <nav class="header-nav">
        <a href="dashboard.html" class="nav-link">▶ Tablero</a>
        <a href="index.html" class="nav-link active">+ Artículos</a>
      </nav>
      <div class="header-user">
        <span id="user-display" class="user-info"></span>
        <button id="logout-btn" class="logout-btn" onclick="logout()">
          🚪 Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <section class="form-section">
      <div class="form-card">
        <div class="form-card__header">
          <h1 class="form-title" id="formTitle">Nuevo Artículo</h1>
          <p class="form-subtitle" id="formSubtitle">Completa los campos para registrar un artículo académico.</p>
        </div>

        <form id="articleForm" class="article-form" novalidate>
          <div class="field-group">
            <label class="field-label" for="articleTitle">
              Título del artículo <span class="required">*</span>
            </label>
            <input
              type="text"
              id="articleTitle"
              name="articleTitle"
              class="field-input"
              placeholder="Ej. Impacto del cambio climático en ecosistemas árticos"
              autocomplete="off"
              required
            />
            <span class="field-error" id="titleError"></span>
          </div>

          <div class="field-group">
            <label class="field-label">
              Archivo del artículo <span class="required">*</span>
            </label>
            <div class="file-upload-area" id="fileUploadArea">
              <div class="file-upload-inner">
                <span class="file-icon">&#128196;</span>
                <p class="file-hint">PDF o DOCX — máximo 20 MB</p>
                <p class="file-name" id="fileName">Ningún archivo seleccionado</p>
              </div>
              <button type="button" class="btn btn--ghost" id="filePickerBtn">
                Seleccionar archivo
              </button>
              <input
                type="file"
                id="fileInput"
                accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                hidden
              />
            </div>
            <span class="field-error" id="fileError"></span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary" id="submitBtn">
              <span class="btn-text">Crear artículo</span>
              <span class="btn-icon">&#10230;</span>
            </button>
          </div>
        </form>

        <div class="toast" id="toast" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <!-- Verificación de autenticación -->
  <script type="module">
    // Verificación simple de sesión activa
    const savedUser = localStorage.getItem('peerreview_user');
    
    if (!savedUser) {
      console.log('🔍 No hay sesión, redirigiendo a login...');
      window.location.replace('./login.html');
    } else {
      try {
        const user = JSON.parse(savedUser);
        if (!user.sessionActive || !user.role) {
          console.log('🔍 Sesión inactiva, redirigiendo a login...');
          window.location.replace('./login.html');
        } else {
          // Mostrar información del usuario en el header
          const userDisplay = document.getElementById('user-display');
          if (userDisplay) {
            const icons = {
              'Autor': '✍️',
              'Revisor': '👁️', 
              'Editor': '📝'
            };
            userDisplay.textContent = `${icons[user.role] || '👤'} ${user.name}`;
          }
        }
      } catch (error) {
        console.log('🔍 Error en sesión, redirigiendo a login...');
        window.location.replace('./login.html');
      }
    }

    // Función de logout global
    window.logout = function() {
      console.log('🚪 Cerrando sesión...');
      
      // Marcar sesión como inactiva
      const savedUser = localStorage.getItem('peerreview_user');
      if (savedUser) {
        try {
          const user = JSON.parse(savedUser);
          user.sessionActive = false;
          localStorage.setItem('peerreview_user', JSON.stringify(user));
        } catch (error) {
          console.error('Error actualizando sesión:', error);
        }
      }
      
      // Limpiar sessionStorage
      sessionStorage.clear();
      
      // Redirigir a login
      window.location.href = './login.html';
    };
  </script>

  <script type="module" src="pages/article-form.js"></script>

  <!-- Indicador de estado de conexión -->
  <script type="module">
    import { ConnectionStatus } from './components/ConnectionStatus.js';
    ConnectionStatus.init();
  </script>

  <!-- Registro de Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('[PWA] Service Worker registrado:', registration.scope);
          })
          .catch((error) => {
            console.log('[PWA] Error registrando Service Worker:', error);
          });
      });
    }
  </script>
</body>
</html>
