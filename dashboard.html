<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeerReview - Tablero de Control</title>
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  <link rel="stylesheet" href="styles/minimal.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <span class="logo">PeerReview</span>
      <nav class="header-nav">
        <a href="#dashboard" class="nav-link active" id="nav-dashboard">▶ Tablero</a>
        <a href="#edit" class="nav-link" id="nav-edit">+ Nuevo Artículo</a>
      </nav>
      <div class="header-user">
        <span id="user-display" class="user-info"></span>
        <button class="logout-btn" onclick="logout()">🚪 Cerrar Sesión</button>
      </div>
    </div>
  </header>

  <!-- Vistas -->
  <div id="dashboard-view" data-view="dashboard" style="display: block;">
    <div class="dashboard-container">
      <div id="dashboard-content"></div>
    </div>
  </div>

  <div id="form-view" data-view="form" style="display: none;"></div>

  <div id="article-view" data-view="article" style="display: none;">
    <main class="main-content">
      <div id="article-detail" class="article-detail"></div>
    </main>
  </div>

  <!-- Autenticación -->
  <script type="module">
    const savedUser = localStorage.getItem('peerreview_user');
    if (!savedUser) {
      window.location.replace('./login.html');
    } else {
      try {
        const user = JSON.parse(savedUser);
        if (!user.sessionActive || !user.role) {
          window.location.replace('./login.html');
        } else {
          const icons = { 'Autor': '✍️', 'Revisor': '👁️', 'Editor': '📝' };
          const el = document.getElementById('user-display');
          if (el) el.textContent = `${icons[user.role] || '👤'} ${user.name}`;
        }
      } catch {
        window.location.replace('./login.html');
      }
    }

    window.logout = function () {
      try {
        const u = JSON.parse(localStorage.getItem('peerreview_user') || '{}');
        u.sessionActive = false;
        localStorage.setItem('peerreview_user', JSON.stringify(u));
      } catch {}
      sessionStorage.clear();
      window.location.href = './login.html';
    };
  </script>

  <!-- App -->
  <script type="module">
    import { Router }           from './components/Router.js';
    import { SyncEngine }       from './components/SyncEngine.js';
    import { SyncButton }       from './components/SyncButton.js';
    import { ConnectionStatus } from './components/ConnectionStatus.js';
    import { ArticleDetail }    from './components/ArticleDetail.js';
    import { AuthManager }      from './components/AuthManager.js';

    // ── Helpers ──────────────────────────────────────────────────────────────

    function setActiveNav(id) {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
    }

    async function loadFormView(editId = null) {
      const container = document.getElementById('form-view');
      if (!container) return;

      container.innerHTML = `
        <div class="form-container">
          <div class="form-card">
            <div class="form-card__header">
              <h1 id="formTitle">${editId ? 'Editar artículo' : 'Nuevo artículo'}</h1>
              <p class="form-subtitle" id="formSubtitle">
                ${editId
                  ? 'Actualiza título y/o archivo del artículo.'
                  : 'Completa los campos para registrar un artículo académico.'}
              </p>
            </div>
            <form id="articleForm" class="article-form" novalidate>
              <div class="field-group">
                <label class="field-label" for="articleTitle">
                  Título del artículo <span class="required">*</span>
                </label>
                <input
                  type="text" id="articleTitle" name="articleTitle"
                  class="field-input"
                  placeholder="Ej. Impacto del cambio climático en ecosistemas árticos"
                  autocomplete="off" required
                />
                <span class="field-error" id="titleError"></span>
              </div>

              <div class="field-group">
                <label class="field-label">
                  Archivo del artículo ${editId ? '' : '<span class="required">*</span>'}
                </label>
                <div class="file-upload-area" id="fileUploadArea">
                  <div class="file-upload-inner">
                    <span class="file-icon">&#128196;</span>
                    <p class="file-hint">PDF o DOCX — máximo 20 MB</p>
                    <p class="file-name" id="fileName">Ningún archivo seleccionado</p>
                  </div>
                  <button type="button" class="btn btn--ghost" id="filePickerBtn">
                    Seleccionar archivo
                  </button>
                  <input type="file" id="fileInput"
                    accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                    hidden />
                </div>
                <span class="field-error" id="fileError"></span>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn--primary" id="submitBtn">
                  <span class="btn-text">${editId ? 'Guardar cambios' : 'Crear artículo'}</span>
                  <span class="btn-icon">&#10230;</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      `;

      // Cargar script del formulario una sola vez
      await new Promise((resolve, reject) => {
        if (window.__articleFormScriptLoaded) return resolve();
        const existing = document.querySelector('script[data-peerreview="article-form"]');
        if (existing) { window.__articleFormScriptLoaded = true; return resolve(); }
        const s = document.createElement('script');
        s.type = 'module';
        s.src = './pages/article-form.js';
        s.dataset.peerreview = 'article-form';
        s.onload = () => { window.__articleFormScriptLoaded = true; resolve(); };
        s.onerror = reject;
        document.head.appendChild(s);
      });

      // Actualizar querystring para que article-form.js detecte edición
      const url = new URL(window.location.href);
      editId ? url.searchParams.set('id', editId) : url.searchParams.delete('id');
      window.history.replaceState({}, '', url.toString());

      setTimeout(() => window.__initArticleForm?.(), 0);
    }

    // ── Inicialización ────────────────────────────────────────────────────────

    async function initApp() {
      AuthManager.init();
      await SyncEngine.init();
      SyncButton.init();
      ConnectionStatus.init();

      // ── Rutas ───────────────────────────────────────────────────────────────

      Router.register('#dashboard', () => {
        Router.showView('dashboard');
        setActiveNav('nav-dashboard');
        import('./pages/dashboard.js').then(m => m.initDashboard());
      });

      Router.register('#edit', () => {
        Router.showView('form');
        setActiveNav('nav-edit');
        loadFormView(null);
      });

      Router.register('#edit/:id', () => {
        Router.showView('form');
        setActiveNav('nav-edit');
        const params = Router.getParams('#edit/:id');
        loadFormView(params?.id || null);
      });

      Router.register('#article/:id', async () => {
        Router.showView('article');
        setActiveNav('nav-dashboard'); // el detail sigue siendo parte del tablero

        const params = Router.getParams('#article/:id');
        const articleId = params?.id;

        if (!articleId) {
          Router.navigate('dashboard');
          return;
        }

        // Limpiar contenido previo
        const container = document.getElementById('article-detail');
        if (container) container.innerHTML = '';

        try {
          await ArticleDetail.init('article-detail', articleId);
        } catch (err) {
          console.error('❌ Error cargando artículo:', err);
          if (container) {
            container.innerHTML = `
              <div class="error-message">
                <h2>❌ Error cargando artículo</h2>
                <p>${err.message}</p>
                <a href="#dashboard" class="btn btn--primary">Volver al Tablero</a>
              </div>
            `;
          }
        }
      });

      Router.init();
      setTimeout(() => Router.handleRoute(), 0);
    }

    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', initApp)
      : initApp();
  </script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('[PWA] SW registrado:', r.scope))
          .catch(e => console.log('[PWA] Error SW:', e));
      });
    }
  </script>

</body>
</html>
